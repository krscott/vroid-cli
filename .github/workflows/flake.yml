name: Nix flake

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      # Caches what cache.nixos.org lacks, chiefly VRoid and its interop
      # assemblies, in this repository's GitHub Actions cache.
      - uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          use-flakehub: disabled
          diagnostic-endpoint: ""

      # The flake check runs the Python and bridge protocol tests from `just test`.
      - name: Check
        run: nix develop -c just check

      - name: Run
        run: nix run -L . -- --help
