[IL2CPP]
UnityBaseLibrariesSource = 6000.0.62.zip
# Interop assemblies are prebuilt in the read-only Nix store. A mismatch logs
# "possibly out of date" instead of regenerating them there.
UpdateInteropAssemblies = false

[Logging.Console]
Enabled = false

[Logging.Disk]
Enabled = true
LogLevels = Fatal, Error, Warning, Message, Info
# vroid-cli reads this boot's log as soon as the bridge reports ready. be.788
# passes this setting as "delayedFlushing", so false writes every line at once.
InstantFlushing = false
